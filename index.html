<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ספר ספקים ונוער לבון 2026</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#0F172A;min-height:100vh;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    direction:rtl;
    color:#F8FAFC;
    display:flex;
    justify-content:center;
  }
  .app{width:100%;max-width:560px;background:#1E293B;min-height:100vh;position:relative;box-shadow:0 0 30px rgba(0,0,0,0.5);}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
    padding:22px 18px 18px;
    border-bottom:3px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 25px rgba(139,92,246,0.3);
  }
  header h1{color:#FFFFFF;font-size:23px;font-weight:900;margin-bottom:4px;letter-spacing:-0.5px;}
  header .sub{color:rgba(255,255,255,0.85);font-size:13px;margin-bottom:14px;font-weight:500;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute;top:50%;right:16px;transform:translateY(-50%);width:18px;height:18px;stroke:#8B5CF6;}
  #search{
    width:100%;height:48px;border-radius:24px;border:none;
    background:#0F172A;color:#F8FAFC;font-size:15px;font-weight:500;
    padding:0 48px 0 16px;outline:none;
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);
  }
  #search::placeholder{color:#64748B;}
  #search:focus{box-shadow:inset 0 2px 4px rgba(0,0,0,0.3), 0 0 0 2px #EC4899;}

  .section-divider {
    padding: 20px 18px 8px;
    font-size: 16px;
    font-weight: 800;
    color: #94A3B8;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }

  .categories{padding:10px 14px 40px;display:flex;flex-direction:column;gap:14px;}

  .cat{border-radius:18px;overflow:hidden;background:#27354A;border:1px solid rgba(255,255,255,0.06);box-shadow:0 4px 15px rgba(0,0,0,0.2);}
  .cat-head{
    display:flex;align-items:center;gap:12px;padding:16px 18px;
    cursor:pointer;user-select:none;background:none;border:none;width:100%;
    text-align:right;font-family:inherit;
  }
  .cat-icon{
    width:42px;height:42px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;flex:0 0 auto;box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }
  .cat-icon svg{width:21px;height:21px;stroke:white;}
  .cat-title{flex:1;font-size:16px;font-weight:800;color:#F1F5F9;}
  .cat-count{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,0.08);color:#CBD5E1;}
  .chev{width:18px;height:18px;transition:transform .25s ease;flex:0 0 auto;color:#94A3B8;}
  .cat.open .chev{transform:rotate(180deg);}

  .cat-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .cat.open .cat-body{max-height:2200px;}
  .cat-list{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;}

  .row{
    display:flex;flex-direction:column;gap:8px;
    padding:14px;border-radius:14px;background:#1E293B;border:1px solid rgba(255,255,255,0.04);
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .row:hover{border-color:rgba(139,92,246,0.4);transform:translateY(-1px);}
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .row-name{font-size:15px;font-weight:800;color:#F8FAFC;}
  .row-desc{font-size:13px;color:#94A3B8;font-weight:500;}
  .row-addr{font-size:12px;color:#64748B;display:flex;align-items:center;gap:4px;margin-top:2px;}
  
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .action-pill{
    display:flex;align-items:center;gap:6px;text-decoration:none;
    background:#0F172A;border-radius:20px;padding:6px 12px;
    font-size:12.5px;font-weight:700;white-space:nowrap;
    border:1px solid rgba(255,255,255,0.08);
    transition:all 0.2s ease;
  }
  .action-pill:active{transform:scale(0.95);}
  .action-pill svg{width:13px;height:13px;}
  
  .tel-pill{color:#34D399;border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.05);}
  .mail-pill{color:#FBBF24;border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.05);}
  .web-pill{color:#A78BFA;border-color:rgba(167,139,250,0.3);background:rgba(167,139,250,0.05);}

  .hidden{display:none !important;}
  .empty-msg{text-align:center;color:#64748B;font-size:14px;padding:40px 20px;font-weight:600;}

  .c1 .cat-icon{background:linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);}
  .c2 .cat-icon{background:linear-gradient(135deg, #10B981 0%, #047857 100%);}
  .c3 .cat-icon{background:linear-gradient(135deg, #EC4899 0%, #BE185D 100%);}
  .c4 .cat-icon{background:linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);}
  .c5 .cat-icon{background:linear-gradient(135deg, #F59E0B 0%, #B45309 100%);}

  footer{text-align:center;padding:20px;font-size:12px;color:#64748B;font-weight:600;}
</style>
</head>
<body>

     {name:'שי שיווק מתנות ומוצרי פרסום', desc:'מוצרי קד"מ, מתנות וצוות', addr:'אזורי', phones:['052-9988776'], email:'shaygifts@gmail.com', web:''},
     {name:'שי תעשיות שלטים', desc:'שילוט הכוונה, שלטים מוארים ושלטי פח', addr:'אזור התעשייה', phones:['04-998-3322'], email:'shaysigns@gmail.com', web:''},
     {name:'סט כרמיאל בע"מ', desc:'הדפסת חולצות טריקו מודפסות לנוער ואירועים', addr:'החרושת 12, כרמיאל', phones:['04-998-4455'], email:'setkarmiel@gmail.com', web:'https://set-print.co.il'},
     {name:'ישראגרף', desc:'דפוס והפקות גרפיות גדולות', addr:'אזורי', phones:['04-955-1122'], email:'print@isragraph.co.il', web:'https://isragraph.co.il'}

];

function toTel(n){ return n.replace(/[^0-9+]/g,''); }

const supEl = document.getElementById('categoriesSuppliers');
supEl.innerHTML = SUPPLIERS_DATA.map((cat, idx) => `
  <div class="cat c${(idx%5)+1} ${cat.id} ${idx===0?'open':''}" data-id="${cat.id}">
    <button class="cat-head" data-toggle="${cat.id}">
      <div class="cat-icon">${ic(cat.icon)}</div>
      <div class="cat-title">${cat.title}</div>
      <div class="cat-count">${cat.items.length}</div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="cat-body">
      <div class="cat-list">
        ${cat.items.map(item => `
          <div class="row" data-name="${item.name}" data-desc="${item.desc}" data-addr="${item.addr}" data-phones="${item.phones.join(' ')}">
            <div class="row-top">
              <div class="row-info">
                <div class="row-name">${item.name}</div>
                <div class="row-desc">${item.desc}</div>${item.addr ? `<div class="row-addr">📍 ${item.addr}</div>` : ''}
              </div>
            </div>
            <div class="row-actions">
              ${item.phones.map(p => `<a class="action-pill tel-pill" href="tel:${toTel(p)}">${ic('phone')} ${p}</a>`).join('')}
              ${item.email ? `<a class="action-pill mail-pill" href="mailto:${item.email}">${ic('mail')} אימייל</a>` : ''}
              ${item.web ? `<a class="action-pill web-pill" href="${item.web}" target="_blank" rel="noopener">${ic('web')} לאתר</a>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>
  </div>`).join('');

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-toggle]');
  if(!btn) return;
  const cat = btn.closest('.cat');
  cat.classList.toggle('open');
});

const searchEl = document.getElementById('search');
const emptyMsgEl = document.getElementById('emptyMsg');
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.cat').forEach(catEl => {
    let catHasMatch = false;
    const rows = catEl.querySelectorAll('.row');
    rows.forEach(row => {
      const hay = (row.dataset.name + ' ' + row.dataset.desc + ' ' + row.dataset.addr + ' ' + row.dataset.phones + ' ' + catEl.querySelector('.cat-title').textContent).toLowerCase();
      const match = q === '' || hay.includes(q);
      row.classList.toggle('hidden', !match);
      if(match) catHasMatch = true;
    });
    catEl.classList.toggle('hidden', !catHasMatch);
    if(q !== ''){
      catEl.classList.toggle('open', catHasMatch);
    } else {
      catEl.classList.toggle('open', catEl.dataset.id === 's1');
    }
    if(catHasMatch) anyVisible = true;
  });
  emptyMsgEl.classList.toggle('hidden', anyVisible);
});
</script>

</html>
